name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # run manually against a tag from the Actions tab

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" Info.plist

      - name: Build
        run: ./build.sh --no-install

      - name: Zip app
        run: ditto -c -k --keepParent build/AutoClicker.app AutoClicker.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # If the release already exists (e.g. created via the GitHub UI),
        # attach the zip to it instead of failing.
        run: |
          gh release create "$GITHUB_REF_NAME" AutoClicker.zip --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" AutoClicker.zip --clobber

  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish windows/AutoClicker.csproj -c Release -r win-x64 \
            --self-contained -p:PublishSingleFile=true -p:Version="$VERSION" \
            -o publish

      - name: Zip exe
        shell: bash
        run: |
          cd publish
          7z a ../AutoClicker-windows.zip AutoClicker.exe

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # The macOS job usually creates the release first; retry briefly in
        # case this job wins the race, then fall back to creating it.
        run: |
          for i in 1 2 3 4 5 6; do
            gh release upload "$GITHUB_REF_NAME" AutoClicker-windows.zip --clobber && exit 0
            sleep 20
          done
          gh release create "$GITHUB_REF_NAME" AutoClicker-windows.zip --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" AutoClicker-windows.zip --clobber
